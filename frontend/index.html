<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ERP AI Analyst · Chat</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero-heading"><div><p class="eyebrow">ERP · ANALYTICS · EVIDENCE</p><h1>Pregunta a tu ERP.</h1></div><button id="new-conversation" class="secondary-button" type="button">Nueva conversación</button></div>
      <p class="lead">Investiga ventas, inventario, compras, payroll y contabilidad con respuestas trazables.</p>
    </header>

    <main class="chat-shell panel">
      <div class="chat-header"><div><strong>Analista ERP</strong><span class="muted">Sesión de consulta</span></div><span id="session-label" class="session-label"></span></div>
      <section id="messages" class="messages" aria-live="polite" aria-busy="false"><div id="empty-state" class="empty-state"><span class="empty-icon">✦</span><h2>¿Qué quieres investigar?</h2><p>Haz una pregunta y recibirás una respuesta con evidencia del ERP sintético.</p></div></section>
      <div class="starter-prompts" aria-label="Preguntas de inicio"><span class="muted">Prueba:</span><button class="prompt-chip" type="button" data-question="¿Por qué disminuyeron las ventas este mes?">Ventas</button><button class="prompt-chip" type="button" data-question="¿Qué productos con riesgo de quiebre tienen órdenes de compra pendientes?">Supply chain</button><button class="prompt-chip" type="button" data-question="¿Cómo evolucionó el costo de nómina y el resultado operativo?">Payroll / contabilidad</button><button class="prompt-chip" type="button" data-question="¿Cuál es el clima de São Paulo?">Fuera de alcance</button></div>
      <form id="analysis-form" class="chat-composer"><label class="sr-only" for="question">Pregunta empresarial</label><textarea id="question" maxlength="2000" required rows="1" placeholder="Escribe una pregunta empresarial…"></textarea><div class="composer-footer"><span id="question-count" class="muted">0 / 2000</span><button id="submit" type="submit">Enviar <span aria-hidden="true">↗</span></button></div></form>
    </main>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
